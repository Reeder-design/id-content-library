name: Deploy Learning Content Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate library metadata
        run: python scripts/validate-library.py

      - name: Check generated library output
        run: python scripts/build-library.py --check

      - name: Validate public library UI
        run: python scripts/validate-public-ui.py

      - name: Validate item previews
        run: python scripts/validate-item-pages.py

      - name: Build public-only site artifact
        run: python scripts/build-public-site.py --output "$RUNNER_TEMP/content-lab-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/content-lab-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
