name: Validate Foundation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Manager authentication test dependency
        run: python -m pip install "Flask>=3.0,<4.0"

      - name: Validate repository foundation
        run: python scripts/validate-foundation.py

      - name: Validate library data model
        run: python scripts/validate-library.py

      - name: Validate public library UI
        run: python scripts/validate-public-ui.py

      - name: Check generated library output
        run: python scripts/build-library.py --check

      - name: Validate item page preview matrix
        run: python scripts/validate-item-pages.py

      - name: Validate Phase 4 UI contracts
        run: python scripts/validate-phase4-ui.py

      - name: Check public JavaScript syntax
        run: |
          node --check js/library.js
          node --check js/public-guide.js

      - name: Check Python syntax
        run: python -m py_compile library-manager/app.py library-manager/auth.py library-manager/smart_prefill.py library-manager/workspace.py library-manager/thumbnailer.py scripts/build-public-site.py scripts/validate-phase8-release.py

      - name: Validate Manager password protection
        run: python scripts/validate-manager-auth.py

      - name: Check Library Manager JavaScript syntax
        run: |
          node --check library-manager/static/manager.js
          node --check library-manager/static/item-form.js

      - name: Validate Phase 6 smart upload behavior
        run: python scripts/validate-phase6-manager.py

      - name: Validate Phase 6.5 Manager UX
        run: python scripts/validate-phase65-manager.py

      - name: Validate Phase 7 preview and publishing
        run: python scripts/validate-phase7-manager.py

      - name: Validate Phase 8 release and v1 acceptance fixtures
        run: python scripts/validate-phase8-release.py
