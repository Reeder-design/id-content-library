name: Validate Foundation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository foundation
        run: python scripts/validate-foundation.py

      - name: Validate library data model
        run: python scripts/validate-library.py

      - name: Validate public library UI
        run: python scripts/validate-public-ui.py

      - name: Check generated library output
        run: python scripts/build-library.py --check

      - name: Validate item page preview matrix
        run: python scripts/validate-item-pages.py

      - name: Validate Phase 4 UI contracts
        run: python scripts/validate-phase4-ui.py

      - name: Check public JavaScript syntax
        run: node --check js/library.js
