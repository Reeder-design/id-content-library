<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><% block title %>Library Manager<% endblock %></title>
  <link rel="stylesheet" href="/static/manager.css">
</head>
<body>
  <header class="manager-header">
    <div class="shell header-row">
      <a class="brand" href="[[ url_for('library') ]]"><span class="brand-mark">L</span><span>Library Manager</span></a>
      <nav>
        <a href="[[ url_for('library') ]]">Library</a>
        <a class="button" href="[[ url_for('add_item') ]]">Add Item</a>
      </nav>
    </div>
  </header>
  <main class="shell manager-main">
    <% with messages = get_flashed_messages(with_categories=true) %>
      <% for category, message in messages %>
        <div class="flash flash-[[ category ]]">[[ message ]]</div>
      <% endfor %>
    <% endwith %>
    <% block content %><% endblock %>
  </main>
  <script src="/static/manager.js"></script>
</body>
</html>
