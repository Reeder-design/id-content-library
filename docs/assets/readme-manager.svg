<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Library Manager illustrated workspace</title>
  <desc id="desc">A local workspace diagram showing item intake, a public-card preview, validation, and deliberate publishing.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#153941"/><stop offset="1" stop-color="#2c6b63"/></linearGradient><linearGradient id="line" x2="1" y2="0"><stop stop-color="#81d5b1"/><stop offset="1" stop-color="#c8ed7c"/></linearGradient></defs>
  <rect width="1200" height="430" rx="25" fill="url(#bg)"/>
  <rect x="24" y="22" width="1152" height="386" rx="20" fill="#f4faf7"/>
  <path d="M44 22h1112a20 20 0 0 1 20 20v47H24V42a20 20 0 0 1 20-20Z" fill="#102e37"/>
  <circle cx="58" cy="55" r="6" fill="#81d5b1"/><circle cx="79" cy="55" r="6" fill="#c8ed7c"/><circle cx="100" cy="55" r="6" fill="#bde4e0"/>
  <text x="133" y="62" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="800">Library Manager</text>
  <text x="880" y="61" fill="#d2eedc" font-family="Arial, sans-serif" font-size="15" font-weight="700">LOCAL · PASSWORD PROTECTED</text>
  <text x="58" y="136" fill="#2b6e68" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2">AN ILLUSTRATED LOOK INSIDE THE WORKSPACE</text>
  <text x="58" y="183" fill="#1b363d" font-family="Arial, sans-serif" font-size="34" font-weight="800">Prepare a resource before it joins the public shelf.</text>
  <g font-family="Arial, sans-serif" fill="#31514a">
    <g transform="translate(58 217)"><rect width="250" height="150" rx="18" fill="#e9f7ee" stroke="#a4d9bc"/><rect x="19" y="20" width="45" height="45" rx="10" fill="#fff"/><path d="M41 30v25M29 42h25" stroke="#298879" stroke-width="5" stroke-linecap="round"/><text x="19" y="91" font-size="20" font-weight="800">Add an item</text><text x="19" y="120" font-size="16">Files and context</text></g>
    <g transform="translate(333 217)"><rect width="250" height="150" rx="18" fill="#e9f7ee" stroke="#a4d9bc"/><rect x="19" y="20" width="45" height="45" rx="10" fill="#fff"/><path d="M29 34h25v20H29zM35 60h13" fill="none" stroke="#298879" stroke-width="4" stroke-linecap="round"/><text x="19" y="91" font-size="20" font-weight="800">Preview the card</text><text x="19" y="120" font-size="16">See the visitor view</text></g>
    <g transform="translate(608 217)"><rect width="250" height="150" rx="18" fill="#e9f7ee" stroke="#a4d9bc"/><rect x="19" y="20" width="45" height="45" rx="10" fill="#fff"/><path d="m29 43 9 9 17-21" fill="none" stroke="#298879" stroke-width="5" stroke-linecap="round"/><text x="19" y="91" font-size="20" font-weight="800">Check the item</text><text x="19" y="120" font-size="16">Metadata, paths, safety</text></g>
    <g transform="translate(883 217)"><rect width="259" height="150" rx="18" fill="#e9f7ee" stroke="#a4d9bc"/><rect x="19" y="20" width="45" height="45" rx="10" fill="#fff"/><path d="M30 48h22M43 34l13 14-13 14" fill="none" stroke="#298879" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="19" y="91" font-size="20" font-weight="800">Publish deliberately</text><text x="19" y="120" font-size="16">Public-safe content only</text></g>
