<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Content Library</title>
  <desc id="desc">A dark teal cover with a large Content Library title and illustrated cards for templates, interactions, scripts, and resources.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102e37"/><stop offset=".65" stop-color="#175458"/><stop offset="1" stop-color="#287569"/></linearGradient><linearGradient id="mint" x2="1" y2="0"><stop stop-color="#81d5b1"/><stop offset="1" stop-color="#c8ed7c"/></linearGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#dff7ea" opacity=".08"/></pattern></defs>
  <rect width="1200" height="520" rx="26" fill="url(#bg)"/><rect width="1200" height="520" rx="26" fill="url(#grid)"/>
  <circle cx="1060" cy="30" r="270" fill="#b8eeb0" opacity=".07"/>
  <text x="64" y="83" fill="#c4ecda" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="4">HALEY REEDER  /  REUSABLE LEARNING WORK</text>
  <text x="64" y="225" fill="#ffffff" font-family="Arial, sans-serif" font-size="91" font-weight="800">Content</text>
  <text x="64" y="330" fill="url(#mint)" font-family="Arial, sans-serif" font-size="91" font-weight="800">Library</text>
  <text x="68" y="384" fill="#e0f3e8" font-family="Arial, sans-serif" font-size="24">Open it. Try it. Make it your own.</text>
  <path d="M68 429H576" stroke="url(#mint)" stroke-width="4"/>
