    <g transform="rotate(-6 110 110)"><rect width="222" height="268" rx="20" fill="#f2fff7"/><rect x="24" y="25" width="174" height="102" rx="13" fill="#d7f2e3"/><path d="M64 48h104M64 70h84M64 92h93" stroke="#368976" stroke-width="10" stroke-linecap="round"/><text x="25" y="181" font-size="21" font-weight="800">Templates</text><text x="25" y="215" font-size="16">A useful starting point</text></g>
